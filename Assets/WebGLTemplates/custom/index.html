<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: black;
    }

    #unity-canvas {
      height: 100%;
      width: 100%;
    }

    #loading-screen {
      position: absolute;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    let startTime = performance.now(); // Track start time
    console.log("Start time recorded as:", startTime.toFixed(2), "ms");
    
    function resizeCanvas() {
      // visualViewport is the accurate visible area on iOS; fall back to innerWidth/Height.
      var vv = window.visualViewport;
      var w = Math.round(vv ? vv.width : window.innerWidth);
      var h = Math.round(vv ? vv.height : window.innerHeight);
      window.scrollTo(0, 0);
      document.documentElement.style.width = w + "px";
      document.documentElement.style.height = h + "px";
      document.body.style.width = w + "px";
      document.body.style.height = h + "px";
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', resizeCanvas);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resizeCanvas);
      window.visualViewport.addEventListener('scroll', function () { window.scrollTo(0, 0); });
    }
    // Scroll-lock: CSS touch-action alone won't stop iOS pinch-pan; non-passive touchmove does.
    // Unity still receives the touch events (preventDefault only cancels browser scroll/zoom).
    window.addEventListener('scroll', function () { window.scrollTo(0, 0); }, { passive: true });
    document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); });

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    console.log("Loader URL: ", loaderUrl);
    
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    };

    console.log("Config loaded: ", config);

    var script = document.createElement("script");
    script.src = loaderUrl;
    
    script.onload = () => {
      console.log("Loader script loaded at:", performance.now().toFixed(2), "ms");
      let loadStart = performance.now();
      createUnityInstance(canvas, config, (progress) => {
        console.log("Loading progress: ", progress);
      }).then((unityInstance) => {
        let loadEnd = performance.now();
        console.log("Unity instance initialized in", (loadEnd - loadStart).toFixed(2), "ms");
        console.log("Total time from script start: ", (loadEnd - startTime).toFixed(2), "ms");
        
        // Measure cache load time
        if ('caches' in window) {
          console.log("Checking cache at:", performance.now().toFixed(2), "ms");
          caches.open('unity-cache').then(cache => {
            let cacheTime = performance.now();
            console.log("Cache load time:", cacheTime.toFixed(2), "ms");
            console.log("Start time:", startTime.toFixed(2), "ms");
            console.log("Time difference from start:", (cacheTime - startTime).toFixed(2), "ms");
          }).catch(() => {
            let noCacheTime = performance.now();
            console.log("Cache not found. Network load time:", noCacheTime.toFixed(2), "ms");
            console.log("Start time:", startTime.toFixed(2), "ms");
            console.log("Time difference from start:", (noCacheTime - startTime).toFixed(2), "ms");
          });
        }
      }).catch((message) => {
        console.error("Unity loading error: ", message);
      });
    };
    
    script.onerror = () => {
      console.error("Failed to load Unity loader script");
    };

    document.body.appendChild(script);
    window.addEventListener('load', () => {
      console.log("Page fully loaded at:", performance.now().toFixed(2), "ms");
      resizeCanvas();
    });
  </script>
  <script>
    window.addEventListener('beforeunload', () => {
      console.log("Page unloading. Caching Unity data...");
    });
  </script>

  <script>
    window.focus();
  </script>

</body>

</html>
